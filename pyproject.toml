[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-license-plate-recognition"
version = "1.0.0"
description = "Pipeline nhận diện biển số xe Việt Nam (YOLOv8 + EasyOCR)"
requires-python = ">=3.11"
dependencies = [
    "ultralytics==8.3.227",
    "easyocr==1.7.2",
    "opencv-python-headless==4.11.0.86",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "PyYAML>=6,<7",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1.2,<2", "httpx>=0.27,<1"]

[project.scripts]
vlpr-prepare = "scripts.prepare_dataset:main"
vlpr-train = "scripts.train:main"
vlpr-predict = "scripts.predict:main"
vlpr-evaluate-detector = "scripts.evaluate_detector:main"
vlpr-evaluate-ocr = "scripts.evaluate_ocr:main"
vlpr-evaluate-e2e = "scripts.evaluate_end_to_end:main"

[tool.setuptools]
packages = ["src", "app", "resources", "scripts"]

[tool.setuptools.package-data]
resources = ["*.yaml"]
app = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=./.pytest_tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
